name: ${COMPOSE_PROJECT_NAME:-ingversionsdigital-live}

services:
  web:
    container_name: ${CONTAINER_NAME:-ingversionsdigital-live-production}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: production
        VITE_FORMSPREE_ENDPOINT: ${VITE_FORMSPREE_ENDPOINT}
        VITE_GTM_ID: ${VITE_GTM_ID}
        VITE_CLARITY_ID: ${VITE_CLARITY_ID}
    image: ingversionsdigital-live:production
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-ingversionsdigital-live}.rule=Host(`${WEBSITE_DOMAIN:-ingversionsdigital.com}`) || Host(`${WWW_DOMAIN:-www.ingversionsdigital.com}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-ingversionsdigital-live}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-ingversionsdigital-live}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-ingversionsdigital-live}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME:-ingversionsdigital-live}.service=${TRAEFIK_SERVICE_NAME:-ingversionsdigital-live}"
      - "traefik.http.services.${TRAEFIK_SERVICE_NAME:-ingversionsdigital-live}.loadbalancer.server.port=80"
    ports:
      - "${WEBSITE_PUBLIC_PORT:-8090}:80"

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-ingversionsdigital-live-network}
