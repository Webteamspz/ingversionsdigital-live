    <!-- FAQ schema, pulled directly from your faq.list config -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is Conversion Rate Optimization?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Conversion Rate Optimization (CRO) is the process of refining a website to better convert visitors into customers or subscribers. It involves boosting the percentage of visitors who complete a specific action, such as making a purchase, signing up, or downloading a file, using techniques like A/B testing, design adjustments, and improved navigation."
            }
          },
          {
            "@type": "Question",
            "name": "How can a CRO agency help your business?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We identify and prioritize high-impact opportunities, run experiments, and ship iterative improvements that lift revenue and lead quality."
            }
          },
          {
            "@type": "Question",
            "name": "What services do you offer as a CRO agency?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A/B testing, UX research, analytics, Shopify and WordPress development, QA, personalization, and performance fixes."
            }
          },
          {
            "@type": "Question",
            "name": "How long does it take to see results from CRO efforts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Usually 2 to 4 weeks for directional signal depending on traffic, and 6 to 8 weeks for stronger confidence."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to redesign my entire website for CRO?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not necessarily. We start with targeted improvements and experiments before considering a full redesign."
            }
          },
          {
            "@type": "Question",
            "name": "Will CRO impact my website's SEO?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We follow technical best practices; CRO and SEO often complement each other when implemented correctly."
            }
          },
          {
            "@type": "Question",
            "name": "Can you integrate CRO with my existing marketing strategies?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We integrate with your existing analytics, ad platforms, and CRM to track end-to-end outcomes."
            }
          }
        ]
      }
    </script>
