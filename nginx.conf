server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

  # Repeated in every location below: nginx does not inherit server-level
  # add_header into a location that declares its own add_header.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://*.clarity.ms https://firestore.googleapis.com https://cloudflareinsights.com; frame-src https://www.googletagmanager.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;

  if ($host = www.ingversionsdigital.com) {
    return 301 https://ingversionsdigital.com$request_uri;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://*.clarity.ms https://firestore.googleapis.com https://cloudflareinsights.com; frame-src https://www.googletagmanager.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    return 200 "ok\n";
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://*.clarity.ms https://firestore.googleapis.com https://cloudflareinsights.com; frame-src https://www.googletagmanager.com; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    try_files $uri =404;
  }

  # Known SPA routes serve the app shell with 200. Keep in sync with src/App.jsx.
  # scripts/prerender.mjs writes <route>.html with that route's head tags;
  # /index.html is the fallback if the prerendered file is missing.
  location ~ ^/(projects|pricing|ab-test-calculator|about-us|teampage|privacy-policy|terms-of-service|thank-you|ab-testing|shopify-development|quality-assurance|wordpress-development|landing-page-personalization)/?$ {
    try_files /$1.html /index.html =404;
  }

  # Blog home and posts. scripts/prerender.mjs writes blog.html and
  # blog/<slug>.html for every post, so an unknown slug has no file and gets a
  # real 404 (the app shell then renders the blog's own 404 view).
  location ~ ^/blog/?$ {
    try_files /blog.html /index.html =404;
  }

  location ~ ^/blog/([a-z0-9-]+)/?$ {
    try_files /blog/$1.html =404;
    error_page 404 /404.html;
  }

  # Anything else is a real 404: the app shell still renders its NotFound page,
  # but with a 404 status so search engines do not index it. 404.html is the
  # prerendered shell carrying the NotFound head tags (noindex).
  location / {
    try_files $uri $uri/ =404;
    error_page 404 /404.html;
  }
}
